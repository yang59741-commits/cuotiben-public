        <div class="panel" id="p-input">
      <div class="card compact">
        <div class="card-header"><h3 style="border:none;margin:0;padding:0;font-size:15px"><span data-icon="filePlus"></span>录入题目到试题库</h3></div>
        <div class="card-body" style="padding-top:4px">
        <div class="fld-row">
          <div class="fld-inline"><label for="i-subject">科目</label><select id="i-subject"></select></div>
          <div class="fld-inline"><label for="i-chapter">章节</label><select id="i-chapter" disabled><option value="">请先选择科目</option></select></div>
        </div>
        <div class="editor-wrap">
          <div class="editor-toolbar">
            <div class="tb-group">
              <button type="button" data-latex-command="bold" title="加粗" aria-label="加粗"><span data-icon="bold"></span></button>
              <button type="button" data-latex-command="italic" title="斜体" aria-label="斜体"><span data-icon="italic"></span></button>
            </div>
            <div class="tb-divider"></div>
            <div class="tb-group">
              <button type="button" data-latex-command="display-math" title="独立公式" aria-label="独立公式"><span data-icon="alignLeft"></span></button>
              <button type="button" data-latex-command="inline-math" title="行内公式" aria-label="行内公式"><span data-icon="brackets"></span></button>
              <button type="button" data-latex-command="proof" title="证明环境" aria-label="证明环境"><span data-icon="code"></span></button>
            </div>
            <div class="tb-divider"></div>
            <div class="tb-group">
              <button type="button" data-latex-command="enumerate" title="枚举列表" aria-label="枚举列表"><span data-icon="listOrdered"></span></button>
              <button type="button" data-latex-command="aligned" title="对齐公式" aria-label="对齐公式"><span data-icon="alignLeft"></span></button>
            </div>
            <button type="button" data-action="pick-problem-file" title="上传文件" aria-label="上传文件" style="margin-left:auto"><span data-icon="upload"></span></button>
          </div>
          <div class="editor-body">
            <label class="sr-only" for="i-content">LaTeX 题目内容</label><textarea id="i-content" placeholder="在此编写 LaTeX 题目内容..." rows="10"></textarea>
          </div>
        </div>
        <input type="file" id="i-file" accept=".pdf,.docx,.tex,.txt" style="display:none" onchange="handleFileInput(event)">
        <button type="button" class="drop-zone" id="drop-zone">
          <span class="drop-icon" data-icon="cloudUpload"></span>
          <span>拖拽 PDF / DOCX / .tex / .txt 文件到此处，或点击选择</span>
          <span class="dz-hint">识别或提取后的内容将自动填入上方编辑区</span>
        </button>
        <p class="remote-capability-note" role="note">PDF 会先在电脑上逐页转成图片，再发送给 DeepSeek 视觉模型识别；不会上传原始 PDF，也不会调用 Mathpix。DOCX、TeX、TXT 仍只在电脑本地提取。</p>
        </div>
        <div class="card-footer" style="padding-top:0">
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-p" data-action="submit-problem"><span data-icon="archive"></span>保存到试题库</button>
            <span id="i-status" role="status" aria-live="polite" style="font-size:11px;color:var(--muted);align-self:center"></span>
          </div>
        </div>
      </div>
      <section class="card compact daily-tip-manager" aria-labelledby="daily-tip-heading">
        <div class="card-header daily-tip-manager-header">
          <div>
            <h3 id="daily-tip-heading"><span data-icon="lightbulb"></span>录入每日提示</h3>
            <p>记录重要结论；数据独立保存，非真题 PDF 每次最多随机加入 5 条。</p>
          </div>
          <span id="daily-tip-count" class="daily-tip-count">0 条</span>
        </div>
        <div class="card-body daily-tip-manager-body">
          <div class="editor-wrap daily-tip-editor">
            <div class="editor-toolbar" aria-label="每日提示公式工具栏">
              <div class="tb-group">
                <button type="button" data-daily-latex="inline-math" title="行内公式" aria-label="插入行内公式"><span data-icon="brackets"></span></button>
                <button type="button" data-daily-latex="display-math" title="独立公式" aria-label="插入独立公式"><span data-icon="alignLeft"></span></button>
              </div>
              <span class="daily-tip-editor-hint">支持文本与 LaTeX 公式</span>
            </div>
            <div class="editor-body">
              <label class="sr-only" for="daily-tip-content">每日提示内容</label>
              <textarea id="daily-tip-content" data-remote-draft-ignore rows="5" maxlength="2000" placeholder="例如：可逆矩阵的行列式不为 0；或输入 $A^{-1}A=I$"></textarea>
            </div>
          </div>
          <div class="daily-tip-form-actions">
            <button type="button" class="btn btn-p btn-sm" id="daily-tip-save"><span data-icon="plus"></span><span>保存提示</span></button>
            <button type="button" class="btn btn-out btn-sm" id="daily-tip-cancel" hidden>取消修改</button>
            <span id="daily-tip-status" role="status" aria-live="polite"></span>
          </div>
          <div id="daily-tip-list" class="daily-tip-list" aria-live="polite"></div>
          <button type="button" class="btn btn-out btn-sm daily-tip-more" id="daily-tip-more" hidden>加载更多</button>
        </div>
      </section>
    </div>
