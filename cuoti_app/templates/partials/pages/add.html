    <div class="panel on" id="p-add">
      <div class="card compact">
        <div class="card-header card-header-tight"><h3 class="card-title-flat"><span data-icon="bookmarkPlus"></span>标记错题</h3></div>
        <div class="card-body card-body-tight">
        <div class="fld-row">
          <div class="fld-inline"><label for="s-subject">科目</label><select id="s-subject"></select></div>
          <div class="fld-inline"><label for="s-chapter">章节</label><select id="s-chapter" disabled><option value="">请先选择科目</option></select></div>
          <div class="fld-inline fld-inline-narrow"><label for="s-date">日期</label><input type="date" id="s-date"></div>
        </div>
        <div class="fld-row"><div class="fld-inline"><label for="s-qnum">题号</label><input id="s-qnum" placeholder="例：模拟卷一 / 7"></div></div>
        <div class="fld-row fld-row-top">
          <span class="field-label field-label-top" id="reason-label">错因</span>
          <div class="tag-row tag-row-fill" id="reason-tags" role="group" aria-labelledby="reason-label">
            <button type="button" class="tag" data-r="计算错误" aria-pressed="false">计算错误</button><button type="button" class="tag" data-r="概念不清" aria-pressed="false">概念不清</button><button type="button" class="tag" data-r="方法不会" aria-pressed="false">方法不会</button><button type="button" class="tag" data-r="卡在技巧" aria-pressed="false">卡在技巧</button><button type="button" class="tag" data-r="审题失误" aria-pressed="false">审题失误</button><button type="button" class="tag" data-r="时间不够" aria-pressed="false">时间不够</button>
          </div>
        </div>
        <div class="fld-row fld-row-top">
          <label class="field-label-top" for="s-problem">题目</label>
          <div class="input-wrap input-wrap-fill">
            <div class="editor-wrap latex-editor is-active" data-latex-editor="s-problem">
              <div class="editor-toolbar latex-toolbar no-math" role="toolbar" aria-label="题目公式工具条" aria-controls="s-problem" data-latex-toolbar="s-problem"></div>
              <div class="editor-body"><textarea id="s-problem" placeholder="粘贴题目（建议不超过10题），带题号可辅助拆分..." rows="4" maxlength="100000" aria-describedby="s-problem-count"></textarea></div>
            </div>
            <div class="latex-field-meta"><span class="latex-field-hint"><kbd>Ctrl</kbd> + <kbd>/</kbd> 打开速查</span><span class="field-count" id="s-problem-count">0 / 100000</span></div>
            <details class="math-live-preview" data-preview-for="s-problem" data-preview-mode="problem"><summary><span class="math-live-preview-bear" aria-hidden="true"></span><span>公式预览</span><small>停止输入后自动刷新</small><span class="math-live-preview-chevron" data-icon="chevronDown"></span></summary><div class="math-live-preview-body" aria-live="off"></div></details>
          </div>
        </div>
        <div class="fld-row fld-note-row">
          <label for="s-note">备注</label>
          <div class="input-wrap">
            <div class="editor-wrap latex-editor" data-latex-editor="s-note">
              <div class="editor-toolbar latex-toolbar no-math" role="toolbar" aria-label="备注公式工具条" aria-controls="s-note" data-latex-toolbar="s-note"></div>
              <div class="editor-body"><textarea id="s-note" class="mistake-note-input" placeholder="可选备注" rows="3" wrap="soft" maxlength="20000" aria-describedby="s-note-count"></textarea></div>
            </div>
            <div class="latex-field-meta"><span></span><span class="field-count" id="s-note-count">0 / 20000</span></div>
            <details class="math-live-preview" data-preview-for="s-note" data-preview-mode="plain"><summary><span class="math-live-preview-bear" aria-hidden="true"></span><span>备注预览</span><small>停止输入后自动刷新</small><span class="math-live-preview-chevron" data-icon="chevronDown"></span></summary><div class="math-live-preview-body" aria-live="off"></div></details>
          </div>
        </div>
        </div>
        <div class="card-footer"><button type="button" class="btn btn-p btn-block" data-action="add-mistake" aria-label="标记错题"><span data-icon="bookmarkPlus"></span>标记错题</button></div>
      </div>
      <div class="latex-dock-scrim" data-latex-dock-close hidden></div>
      <aside class="latex-dock" id="latex-dock" aria-labelledby="latex-dock-title" hidden>
        <div class="task-panel-header latex-dock-header">
          <div><h2 id="latex-dock-title">LaTeX 速查</h2><p>点整行插入到 <b id="latex-dock-target">题目</b> · 面板位置不变</p></div>
          <button type="button" class="icon-btn" data-latex-dock-close aria-label="关闭 LaTeX 速查" title="关闭"><span data-icon="x"></span></button>
        </div>
        <div class="latex-dock-tools">
          <label class="sr-only" for="latex-dock-search">检索 LaTeX 写法</label>
          <div class="search-wrap"><span class="search-icon" data-icon="search"></span><input id="latex-dock-search" class="search-input" type="search" placeholder="搜索：柯西、比值、≤、alpha…" autocomplete="off" spellcheck="false"></div>
          <div class="latex-dock-cats" id="latex-dock-cats" role="group" aria-label="LaTeX 分类"></div>
        </div>
        <div class="latex-dock-body" id="latex-dock-body" aria-live="off"></div>
        <div class="latex-dock-foot no-math">
          <span class="latex-dock-keys"><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>Enter</kbd> 插入</span>
          <span class="latex-wrap-pref" id="latex-wrap-pref" role="group" aria-label="公式包裹符号">包裹<button type="button" data-latex-wrap="dollar" aria-pressed="true">$ $</button><button type="button" data-latex-wrap="paren" aria-pressed="false">\( \)</button></span>
        </div>
      </aside>
    </div>
